name: Continuous Deployment (Generate Tag and Release)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Generate Tag and Release
        run: |
          $version = (cat package.json | grep version | sed 's/"version": //g' | sed 's/,//g' | sed 's/"//g')
          echo "Version: $version"
          git tag -a $version -m "Release $version"
          git push origin $version
