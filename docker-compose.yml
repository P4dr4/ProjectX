name: ProjectX

services:
  frontend:
    container_name: projectxf_container
    build: ./projectXF
    image: pedroaccarini/projectxf:latest
    ports:
      - '0.0.0.0:80:80'
    networks:
      - app-network

  backend:
    container_name: projectxb_container
    build: ./projectXB
    image: pedroaccarini/projectxb:latest
    ports:
      - '0.0.0.0:3000:3000'
    networks:
      - app-network
    environment:
      - MONGO_URL=mongodb://mongo:27017/projectx
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongo:
    container_name: mongo_container
    image: mongo:latest
    ports:
      - '0.0.0.0:27017:27017'
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  app-network:
    driver: bridge
